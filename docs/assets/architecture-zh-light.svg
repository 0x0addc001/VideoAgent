<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">VideoAgent 技术架构</title>
  <desc id="desc">五阶段架构：导演工作台、FastAPI 控制面、Agent 与领域服务、异步生成与模型服务，以及持久化数据和最终交付。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#edf3fa"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="1" stop-color="#72ceff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#235f9e" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#24405e" flood-opacity=".10"/>
    </filter>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#096ee8"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0c9b70"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c87914"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Manrope, sans-serif; }
      .brand { fill:#102238; font-size:31px; font-weight:700; letter-spacing:-.7px; }
      .kicker { fill:#076bc5; font-size:11px; font-weight:700; letter-spacing:1.5px; }
      .subtitle { fill:#5f738a; font-size:13px; }
      .step { fill:#65809b; font-size:10.5px; font-weight:700; letter-spacing:1.2px; }
      .column { fill:#14283e; font-size:20px; font-weight:700; }
      .column-sub { fill:#65798e; font-size:11.5px; }
      .chip { fill:#f5f9fd; stroke:#d4e1ee; }
      .chip-title { fill:#173451; font-size:13px; font-weight:650; }
      .chip-copy { fill:#71859a; font-size:10.5px; }
      .card { fill:#ffffff; stroke:#c7d7e8; }
      .flow { fill:none; stroke:#096ee8; stroke-width:1.8; marker-end:url(#blue); }
      .flow-async { fill:none; stroke:#0c9b70; stroke-width:1.8; stroke-dasharray:8 6; marker-end:url(#green); }
      .flow-data { fill:none; stroke:#c87914; stroke-width:1.7; stroke-dasharray:3 5; marker-end:url(#amber); }
      .flow-label { fill:#8197ad; font-size:9.5px; font-weight:600; }
      .footer { fill:#708399; font-size:10px; }
    </style>
  </defs>

  <rect width="1500" height="820" fill="url(#bg)"/>
  <rect width="1500" height="820" fill="url(#grid)"/>
  <circle cx="1380" cy="64" r="150" fill="#1677ff" opacity=".045"/>

  <g transform="translate(58 36)">
    <rect width="52" height="52" rx="14" fill="#0c1930" stroke="#2b67a3"/>
    <path d="M16 13L40 26L16 39Z" fill="url(#logo)"/>
    <text x="70" y="13" class="kicker">VIDEOAGENT / TECHNICAL ARCHITECTURE</text>
    <text x="70" y="45" class="brand">从灵感到成片，一条受控路径</text>
    <text x="0" y="77" class="subtitle">导演确定方向，Agent 负责规划，服务执行控制，持久化存储保留每个结果。</text>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(58 160)" filter="url(#shadow)">
    <rect width="244" height="544" rx="20" class="card"/>
    <text x="18" y="29" class="step">01 / 体验层</text>
    <text x="18" y="58" class="column">导演工作台</text>
    <text x="18" y="79" class="column-sub">浏览器与产品界面</text>
    <g transform="translate(14 104)">
      <rect width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="20" class="chip-title">浏览器 / Next.js</text>
      <text x="12" y="37" class="chip-copy">响应式产品应用</text>
      <rect y="62" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="82" class="chip-title">Agent 对话与审批</text>
      <text x="12" y="99" class="chip-copy">实时执行轨迹</text>
      <rect y="124" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="144" class="chip-title">故事板画布</text>
      <text x="12" y="161" class="chip-copy">编辑内容与镜头参数</text>
      <rect y="186" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="206" class="chip-title">资产 / 版本 / 文档</text>
      <text x="12" y="223" class="chip-copy">查看、回滚、搜索</text>
      <rect y="248" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="268" class="chip-title">分享与发布</text>
      <text x="12" y="285" class="chip-copy">协作与社区</text>
    </g>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(338 160)" filter="url(#shadow)">
    <rect width="244" height="544" rx="20" class="card"/>
    <text x="18" y="29" class="step">02 / 控制面</text>
    <text x="18" y="58" class="column">FastAPI</text>
    <text x="18" y="79" class="column-sub">Python 3.12 · 异步 REST</text>
    <g transform="translate(14 104)">
      <rect width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="20" class="chip-title">会话与安全</text>
      <text x="12" y="37" class="chip-copy">HttpOnly · CSRF · 限流</text>
      <rect y="62" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="82" class="chip-title">REST 接口</text>
      <text x="12" y="99" class="chip-copy">项目、消息、任务、资产</text>
      <rect y="124" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="144" class="chip-title">审批边界</text>
      <text x="12" y="161" class="chip-copy">计费调用前确认积分</text>
      <rect y="186" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="206" class="chip-title">幂等控制</text>
      <text x="12" y="223" class="chip-copy">安全重试与状态对账</text>
      <rect y="248" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="268" class="chip-title">Pydantic 契约</text>
      <text x="12" y="285" class="chip-copy">请求与响应结构校验</text>
    </g>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(618 160)" filter="url(#shadow)">
    <rect width="244" height="544" rx="20" class="card" stroke="#2b6ca6"/>
    <text x="18" y="29" class="step">03 / 智能层</text>
    <text x="18" y="58" class="column">Agent 与领域服务</text>
    <text x="18" y="79" class="column-sub">规划与业务策略</text>
    <g transform="translate(14 104)">
      <rect width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="20" class="chip-title">Context 与 Memory</text>
      <text x="12" y="37" class="chip-copy">Brief、历史、Skills、故事板</text>
      <rect y="62" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="82" class="chip-title">LangGraph 规划器</text>
      <text x="12" y="99" class="chip-copy">远程模型超时 → 本地兜底</text>
      <rect y="124" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="144" class="chip-title">StoryboardPlan 计划</text>
      <text x="12" y="161" class="chip-copy">角色 · 场景 · 镜头</text>
      <rect y="186" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="206" class="chip-title">项目与版本</text>
      <text x="12" y="223" class="chip-copy">保存、历史、回滚</text>
      <rect y="248" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="268" class="chip-title">积分与资产</text>
      <text x="12" y="285" class="chip-copy">预扣、退款、选用</text>
    </g>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(898 160)" filter="url(#shadow)">
    <rect width="244" height="544" rx="20" class="card" stroke="#28735a"/>
    <text x="18" y="29" class="step" fill="#0c9b70">04 / 生成层</text>
    <text x="18" y="58" class="column">异步任务与模型</text>
    <text x="18" y="79" class="column-sub">与模型服务商解耦的执行</text>
    <g transform="translate(14 104)">
      <rect width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="20" class="chip-title">Redis 与 Celery</text>
      <text x="12" y="37" class="chip-copy">Broker、Worker、结果后端</text>
      <rect y="62" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="82" class="chip-title">轮询兜底</text>
      <text x="12" y="99" class="chip-copy">队列故障时任务仍可恢复</text>
      <rect y="124" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="144" class="chip-title">Provider Resolver</text>
      <text x="12" y="161" class="chip-copy">能力、模型、任务类型</text>
      <rect y="186" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="206" class="chip-title">Pippit CLI</text>
      <text x="12" y="223" class="chip-copy">Seedance · Wan · 参考素材</text>
      <rect y="248" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="268" class="chip-title">可灵 CLI / MCP</text>
      <text x="12" y="285" class="chip-copy">文生视频 · 图生视频 · 全能参考 · 编辑</text>
      <rect y="310" width="216" height="52" rx="10" class="chip"/>
      <text x="12" y="330" class="chip-title">Mock Provider</text>
      <text x="12" y="347" class="chip-copy">无付费积分测试</text>
    </g>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(1178 160)" filter="url(#shadow)">
    <rect width="264" height="544" rx="20" class="card" stroke="#8e5c26"/>
    <text x="18" y="29" class="step" fill="#c87914">05 / 交付层</text>
    <text x="18" y="58" class="column">数据与成片</text>
    <text x="18" y="79" class="column-sub">持久化结果与分发</text>
    <g transform="translate(14 104)">
      <rect width="236" height="52" rx="10" class="chip"/>
      <text x="12" y="20" class="chip-title">PostgreSQL / SQLite</text>
      <text x="12" y="37" class="chip-copy">业务状态的唯一事实来源</text>
      <rect y="62" width="236" height="52" rx="10" class="chip"/>
      <text x="12" y="82" class="chip-title">媒体存储 / MinIO</text>
      <text x="12" y="99" class="chip-copy">图片、视频、音频、校验值</text>
      <rect y="124" width="236" height="52" rx="10" class="chip"/>
      <text x="12" y="144" class="chip-title">FFmpeg 合成</text>
      <text x="12" y="161" class="chip-copy">字幕、音轨、画幅</text>
      <rect y="186" width="236" height="52" rx="10" class="chip"/>
      <text x="12" y="206" class="chip-title">成片与视觉评估</text>
      <text x="12" y="223" class="chip-copy">版本与视觉指标</text>
      <rect y="248" width="236" height="52" rx="10" class="chip"/>
      <text x="12" y="268" class="chip-title">交付</text>
      <text x="12" y="285" class="chip-copy">分享、协作、发布</text>
    </g>
  </g>

  <!-- Clean gutter arrows -->
  <path d="M302 326H338" class="flow"/>
  <path d="M582 326H618" class="flow"/>
  <path d="M862 326H898" class="flow-async"/>
  <path d="M1142 326H1178" class="flow-data"/>
  <text x="305" y="314" class="flow-label">HTTPS</text>
  <text x="586" y="314" class="flow-label">规划</text>
  <text x="865" y="314" class="flow-label">任务</text>
  <text x="1143" y="314" class="flow-label">资产</text>

  <!-- Footer -->
  <rect x="58" y="733" width="1384" height="1" fill="#cbd9e6"/>
  <text x="58" y="755" class="footer">同步</text>
  <text x="108" y="755" class="footer">浏览器 ↔ FastAPI</text>
  <text x="330" y="755" class="footer">异步</text>
  <text x="380" y="755" class="footer">FastAPI → Redis/Celery → Provider</text>
  <text x="720" y="755" class="footer">持久化</text>
  <text x="782" y="755" class="footer">数据库与媒体是唯一事实来源</text>
  <text x="58" y="785" class="footer">跨层能力  ·  服务端凭据  ·  用户与项目隔离  ·  显式审批  ·  幂等  ·  可观测 Agent 活动</text>
</svg>
